name: Reference environment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests review
      - run: python -m pytest -q
      - run: python -m autheo_agent_environment.demo --output demo-output
      - run: python -m autheo_agent_environment.audit demo-output/source-audit.json --public-key demo-output/issuer-public.pem --issuer autheo-demo-authority --environment env:research

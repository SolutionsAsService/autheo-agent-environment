[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autheo-agent-environment"
version = "0.7.0"
description = "Local reference trust layer for agent identities, mandates, declarative policy, signed hash-chained receipts and checkpoint handoffs"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SolutionsAsService"}]
dependencies = ["PyJWT[crypto]>=2.10,<3", "cryptography>=42", "pydantic>=2.11,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18", "pytest-cov>=5", "hypothesis>=6.100"]

[project.scripts]
autheo-agent-demo = "autheo_agent_environment.demo:main"
autheo-agent-web-demo = "autheo_agent_environment.webapp:main"
autheo-agent = "autheo_agent_environment.cli:main"
autheo-verify = "autheo_agent_environment.verifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autheo_agent_environment = ["web/*.html", "web/*.css", "web/*.js", "web/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

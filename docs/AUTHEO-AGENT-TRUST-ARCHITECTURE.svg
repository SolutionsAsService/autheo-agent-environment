<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Autheo Agent Trust Layer — proposed architecture</title>
  <desc id="description">A proposed, phased architecture connecting human and organization owners, agent identities, and applications to Autheo entry points; identity resolution and a human-issued mandate feed a deterministic guardrail interface before any executor. External venue adapters such as Hyperliquid are separated from Autheo. Execution evidence returns through reconciliation to signed receipts and verified outcomes. The diagram also shows the five Autheo platform areas and a continuous prevent, control, detect, contain, recover, learn security lifecycle. The system is proposed, not a live integration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#0d1c2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6c9"/>
      <stop offset="1" stop-color="#76a9ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6b91ae"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#54d6c9"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e9f2f9}
      .title{font-size:34px;font-weight:700;letter-spacing:.02em}
      .subtitle{font-size:15px;fill:#9fb6ca}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;fill:#71d9ce}
      .heading{font-size:17px;font-weight:700}
      .copy{font-size:13px;fill:#b9c9d7}
      .small{font-size:11px;fill:#9fb6ca}
      .stage{font-size:11px;font-weight:700;letter-spacing:.12em;fill:#71d9ce}
      .panel{fill:#112439;stroke:#2a435b;stroke-width:1.3}
      .panel2{fill:#0c1a2a;stroke:#263d53;stroke-width:1.2}
      .control{fill:#122b3b;stroke:#45b8b4;stroke-width:1.6}
      .venue{fill:#251f19;stroke:#d6a65d;stroke-width:1.4}
      .autheo{fill:#101f30;stroke:#29445b;stroke-width:1.1}
      .line{fill:none;stroke:#6b91ae;stroke-width:2;marker-end:url(#arrow)}
      .lineAccent{fill:none;stroke:#54d6c9;stroke-width:2.2;marker-end:url(#arrowAccent)}
      .dash{fill:none;stroke:#5b7185;stroke-width:1.4;stroke-dasharray:7 6}
      .pill{fill:#182d40;stroke:#39566f;stroke-width:1}
      .tagText{font-size:11px;font-weight:600;fill:#c4d6e3}
    </style>
  </defs>
  <rect width="1600" height="1200" rx="24" fill="url(#background)"/>
  <path d="M48 92H1552" stroke="#29445b"/>
  <text x="64" y="53" class="title">AUTHEO · AGENT TRUST LAYER</text>
  <text x="66" y="78" class="subtitle">Proposed north-star architecture · deterministic authority around probabilistic agents</text>
  <rect x="1260" y="34" width="276" height="34" rx="17" class="pill"/>
  <circle cx="1281" cy="51" r="5" fill="#e3b56b"/>
  <text x="1295" y="55" class="tagText">PROPOSED · NOT A LIVE INTEGRATION</text>

  <text x="64" y="122" class="eyebrow">IDENTITIES AND INTENT</text>
  <rect x="64" y="140" width="438" height="124" rx="13" class="panel"/>
  <text x="86" y="170" class="heading">Human + organization</text>
  <text x="86" y="195" class="copy">Authenticated owner · verified role · accountable approver</text>
  <text x="86" y="220" class="copy">Consent and authority come from an approved issuer flow</text>
  <text x="86" y="245" class="small">A DID alone is not legal identity, employment, or consent</text>

  <rect x="520" y="140" width="492" height="124" rx="13" class="panel"/>
  <text x="542" y="170" class="heading">Agent / workload identity</text>
  <text x="542" y="195" class="copy">Distinct subject · controller link · bound and rotatable key</text>
  <text x="542" y="220" class="copy">Runtime / artifact provenance · environment · revocation state</text>
  <text x="542" y="245" class="small">DID-method and credential format remain adapter decisions</text>

  <rect x="1030" y="140" width="506" height="124" rx="13" class="panel"/>
  <text x="1052" y="170" class="heading">Applications · APIs · Marketplace · MCP</text>
  <text x="1052" y="195" class="copy">Typed action intent with resource, payload digest, and request ID</text>
  <text x="1052" y="220" class="copy">External data is untrusted input; model reasoning is not authority</text>
  <text x="1052" y="245" class="small">MCP is an interface/transport, not a policy bypass</text>

  <path d="M283 264V291H207V324" class="line"/>
  <path d="M766 264V324" class="line"/>
  <path d="M1283 264V291H207V324" class="dash"/>
  <circle cx="207" cy="291" r="4" fill="#6b91ae"/>

  <text x="64" y="310" class="eyebrow">TRUSTED ACTION PATH · EVERY CONSEQUENT ACTION RECHECKS AT EXECUTION</text>
  <rect x="64" y="330" width="248" height="202" rx="14" class="panel2"/>
  <text x="86" y="359" class="stage">01 · PROPOSE</text>
  <text x="86" y="389" class="heading">Intent intake</text>
  <text x="86" y="417" class="copy">Canonical tenant / task / resource</text>
  <text x="86" y="441" class="copy">Typed operation + payload digest</text>
  <text x="86" y="465" class="copy">Correlation + idempotency IDs</text>
  <text x="86" y="503" class="small">Proposal does not reserve or execute</text>

  <rect x="338" y="330" width="266" height="202" rx="14" class="panel2"/>
  <text x="360" y="359" class="stage">02 · VERIFY</text>
  <text x="360" y="389" class="heading">Identity + mandate</text>
  <text x="360" y="417" class="copy">Resolve subject, controller, issuer</text>
  <text x="360" y="441" class="copy">Check key, audience, tenant, expiry</text>
  <text x="360" y="465" class="copy">Fetch current revocation / policy</text>
  <text x="360" y="503" class="small">Identity ≠ permission to act</text>

  <rect x="630" y="320" width="350" height="222" rx="16" class="control"/>
  <text x="654" y="351" class="stage">03 · AUTHORIZE</text>
  <text x="654" y="382" class="heading">Agent Guardrail Interface</text>
  <rect x="654" y="398" width="132" height="29" rx="14" class="pill"/>
  <text x="670" y="417" class="tagText">AUTHORITY</text>
  <rect x="797" y="398" width="145" height="29" rx="14" class="pill"/>
  <text x="814" y="417" class="tagText">BUDGET / RATE</text>
  <rect x="654" y="436" width="132" height="29" rx="14" class="pill"/>
  <text x="670" y="455" class="tagText">ASSURANCE</text>
  <rect x="797" y="436" width="145" height="29" rx="14" class="pill"/>
  <text x="814" y="455" class="tagText">POLICY / RISK</text>
  <text x="654" y="492" class="copy">Deny · allow · immutable approval required</text>
  <text x="654" y="518" class="small">Human approval binds to this exact request digest</text>

  <rect x="1006" y="330" width="248" height="202" rx="14" class="panel2"/>
  <text x="1028" y="359" class="stage">04 · EXECUTE</text>
  <text x="1028" y="389" class="heading">Isolated adapters</text>
  <text x="1028" y="417" class="copy">Compute · Marketplace · chain</text>
  <text x="1028" y="441" class="copy">Separate signer / secret broker</text>
  <text x="1028" y="465" class="copy">Idempotent submit + state events</text>
  <text x="1028" y="503" class="small">No agent-held high-value secrets</text>

  <rect x="1280" y="330" width="256" height="202" rx="14" class="panel2"/>
  <text x="1302" y="359" class="stage">05 · RECONCILE</text>
  <text x="1302" y="389" class="heading">Assure + prove</text>
  <text x="1302" y="417" class="copy">Compare executor and venue evidence</text>
  <text x="1302" y="441" class="copy">Signed receipt + status history</text>
  <text x="1302" y="465" class="copy">Verified result to owner / requester</text>
  <text x="1302" y="503" class="small">Unknown is explicit; never blind-retry</text>

  <path d="M312 431H334" class="lineAccent"/>
  <path d="M604 431H626" class="lineAccent"/>
  <path d="M980 431H1002" class="lineAccent"/>
  <path d="M1254 431H1276" class="lineAccent"/>
  <path d="M805 542V571H1128V541" class="dash"/>
  <rect x="643" y="552" width="329" height="36" rx="18" class="pill"/>
  <text x="665" y="575" class="tagText">DENY / HOLD / APPROVAL → NO DISPATCH</text>

  <rect x="338" y="612" width="916" height="102" rx="15" class="venue"/>
  <text x="362" y="642" class="eyebrow" style="fill:#e3b56b">EXTERNAL VENUE EXAMPLE · HYPERLIQUID IS NOT AUTHEO</text>
  <text x="362" y="672" class="heading">Venue adapter: bounded orders → acknowledgements → fills / cancels → reconciliation</text>
  <text x="362" y="696" class="copy">Test environment first · separate funding adapter and signer · no live keys or funds in initial integration</text>
  <path d="M1130 532V608" class="line"/>
  <path d="M1254 660H1269V484H1276" class="line"/>
  <text x="1272" y="687" class="small">Venue evidence</text>

  <text x="64" y="758" class="eyebrow">AUTHEO PLATFORM CONTEXT · TRUST COORDINATES, APPLICATIONS AND EXECUTION STAY SEPARATE</text>
  <rect x="64" y="780" width="280" height="136" rx="12" class="autheo"/>
  <text x="84" y="810" class="stage">1 · ORGANIZATION</text>
  <text x="84" y="841" class="heading">Stewardship + governance</text>
  <text x="84" y="870" class="copy">Owners · roles · standards</text>
  <text x="84" y="893" class="small">Accountable operators</text>

  <rect x="364" y="780" width="280" height="136" rx="12" class="autheo"/>
  <text x="384" y="810" class="stage">2 · LAYER 1</text>
  <text x="384" y="841" class="heading">Trust + coordination</text>
  <text x="384" y="870" class="copy">Identity · agreements · settlement</text>
  <text x="384" y="893" class="small">Not application execution</text>

  <rect x="664" y="780" width="280" height="136" rx="12" class="autheo"/>
  <text x="684" y="810" class="stage">3 · MARKETPLACE</text>
  <text x="684" y="841" class="heading">Discover + schedule</text>
  <text x="684" y="870" class="copy">Resources · policies · SLAs</text>
  <text x="684" y="893" class="small">Chooses where workloads go</text>

  <rect x="964" y="780" width="280" height="136" rx="12" class="autheo"/>
  <text x="984" y="810" class="stage">4 · COMPUTE MESH</text>
  <text x="984" y="841" class="heading">Execute workloads</text>
  <text x="984" y="870" class="copy">CPU / GPU · storage · AI</text>
  <text x="984" y="893" class="small">Isolation + metering required</text>

  <rect x="1264" y="780" width="272" height="136" rx="12" class="autheo"/>
  <text x="1284" y="810" class="stage">5 · DEVELOPER PLATFORM</text>
  <text x="1284" y="841" class="heading">Tools + operations</text>
  <text x="1284" y="870" class="copy">API · SDK · deploy · observe</text>
  <text x="1284" y="893" class="small">Product integration surface</text>

  <path d="M204 916V941H1396V916" class="dash"/>
  <rect x="472" y="927" width="656" height="34" rx="17" class="pill"/>
  <text x="494" y="949" class="tagText">AGENT ENVIRONMENT: POLICY ORCHESTRATION + ADAPTERS · NOT THE WHOLE PLATFORM</text>

  <text x="64" y="1000" class="eyebrow">CONTINUOUS SECURITY LIFECYCLE · NO SINGLE CONTROL GUARANTEES IMMUNITY</text>
  <g>
    <rect x="64" y="1020" width="222" height="66" rx="12" fill="#172c35" stroke="#3e9b89"/>
    <text x="84" y="1047" class="heading">PREVENT</text><text x="84" y="1070" class="small">identity · least privilege</text>
    <rect x="310" y="1020" width="222" height="66" rx="12" fill="#172c35" stroke="#3e9b89"/>
    <text x="330" y="1047" class="heading">CONTROL</text><text x="330" y="1070" class="small">policy · limits · approval</text>
    <rect x="556" y="1020" width="222" height="66" rx="12" fill="#302a1b" stroke="#c5a24f"/>
    <text x="576" y="1047" class="heading">DETECT</text><text x="576" y="1070" class="small">validate · monitor · alert</text>
    <rect x="802" y="1020" width="222" height="66" rx="12" fill="#2c211f" stroke="#c9825d"/>
    <text x="822" y="1047" class="heading">CONTAIN</text><text x="822" y="1070" class="small">revoke · pause · isolate</text>
    <rect x="1048" y="1020" width="222" height="66" rx="12" fill="#1b2639" stroke="#708dd0"/>
    <text x="1068" y="1047" class="heading">RECOVER</text><text x="1068" y="1070" class="small">reconcile · restore safely</text>
    <rect x="1294" y="1020" width="242" height="66" rx="12" fill="#1c2b32" stroke="#58a9a0"/>
    <text x="1314" y="1047" class="heading">LEARN</text><text x="1314" y="1070" class="small">review · test · improve</text>
  </g>
  <path d="M287 1053H305M533 1053H551M779 1053H797M1025 1053H1043M1271 1053H1289" class="lineAccent"/>

  <path d="M64 1110H1536" stroke="#29445b"/>
  <text x="64" y="1141" class="copy">Every production agent has a named human owner. Model intent is probabilistic; authority and execution checks are deterministic.</text>
  <text x="64" y="1167" class="small">Planning artifact only · validate Autheo identity, API, chain, runtime, venue, and custody contracts before implementation or live activation.</text>
</svg>
